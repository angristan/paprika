[workspace]
members = [
  "crates/paprika-core",
  "crates/paprika-pdf",
  "crates/paprika-epub",
  "crates/paprika-cli",
  "crates/paprika-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/angristan/paprika"

[workspace.dependencies]
anyhow = "1.0.100"
bytemuck = "1.24.0"
clap = { version = "4.5.53", features = ["derive"] }
console_error_panic_hook = "0.1.7"
hayro = "0.7.1"
image = { version = "0.25.9", default-features = false }
language-tags = "0.3.2"
miniz_oxide = "0.8.9"
pdf-writer = "0.15.0"
pdf_oxide = { version = "0.3.77", default-features = false }
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
rbook = { version = "0.7.10", default-features = false, features = ["write"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.17"
wasm-bindgen = "0.2.106"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.release.package.paprika-wasm]
opt-level = "s"
