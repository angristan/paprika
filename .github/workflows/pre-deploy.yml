name: Pre-deploy

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable-cli:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run native tests
        run: cargo test --locked --workspace

  verify:
    name: Locked build and smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0

      - name: Install Java for EPUBCheck
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Rust and validation caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/paprika-tools
            target
          key: ${{ runner.os }}-paprika-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'scripts/install-*.sh', 'scripts/check-epub.sh') }}
          restore-keys: |
            ${{ runner.os }}-paprika-

      - name: Install pinned Rust toolchain
        run: bash scripts/install-rust-toolchain.sh

      - name: Install pinned wasm-pack
        run: |
          tools="$HOME/.cache/paprika-tools"
          PAPRIKA_TOOLS_DIR="$tools" bash scripts/install-wasm-pack.sh "$tools/bin"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install browser engines
        run: bun run playwright install --with-deps chromium firefox webkit

      - name: Run pre-deploy gate
        run: bun run predeploy

      - name: Run branch-local browser smoke tests
        env:
          PAPRIKA_E2E_SKIP_BUILD: "1"
        run: bun run test:e2e

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            target/playwright-report/
            target/playwright-results/
          if-no-files-found: ignore
          retention-days: 7
